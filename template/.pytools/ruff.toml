# Ruff: linting, formatting, import sorting
line-length = 100
target-version = "py311"

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "S",   # bandit (security)
  "ASYNC",
  "SIM",
]
ignore = []

[lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
